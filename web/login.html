<!DOCTYPE html>

<title>SISTEMA DE ESTOQUE - LOGIN</title>
<link rel="stylesheet" href="css/style.css">
<body class="tela-login"></body>

</head>

<body>

    <div class="login-container">
        <h2 class="login">LOGIN</h2>

        </form>
